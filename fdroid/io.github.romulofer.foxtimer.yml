# Draft recipe for https://gitlab.com/fdroid/fdroiddata (metadata/<appid>.yml).
# Copy it there in a merge request; it is not used by this repository's build.
Categories:
  - Time
License: GPL-3.0-or-later
AuthorName: Rômulo Fernandes Evangelista
SourceCode: https://github.com/romulofer/foxtimer
IssueTracker: https://github.com/romulofer/foxtimer/issues
Changelog: https://github.com/romulofer/foxtimer/releases

AutoName: FoxTimer

RepoType: git
Repo: https://github.com/romulofer/foxtimer.git

Builds:
  - versionName: 1.5.1
    versionCode: 12
    commit: v1.5.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.48.0-0.5.pre
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    ndk: 28.2.13676358

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.5.1
CurrentVersionCode: 12
